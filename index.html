<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EventBridge – Le pont entre talents et opportunités. La plateforme qui réunit l'élite de l'événementiel en Côte d'Ivoire." />
    <meta name="theme-color" content="#1c1132" />
    <title>EventBridge – Le pont entre talents et opportunités</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Manrope:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Applique le thème enregistré AVANT le rendu React (évite le clignotement).
      (function () {
        try {
          var t = localStorage.getItem('eb-theme');
          document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'dark');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
